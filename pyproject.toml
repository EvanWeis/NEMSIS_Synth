[project]
name = "nemsis-gen"
version = "0.1.0"
description = "Synthetic NEMSIS v3.5.0 PCR generator for validation-pipeline QA"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "lxml>=5.0",
    "click>=8.1",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
nemsis-gen = "nemsis_gen.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nemsis_gen"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
